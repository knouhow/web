name: CI

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, format, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Run unit tests
        run: npm test

      # Match Vercel Preview's development stage without fetching web-config.
      # The invalid API host prevents CI builds from depending on a real backend.
      - name: Type check and build
        run: npm run build
        env:
          VERCEL: "1"
          VERCEL_ENV: preview
          APP_ENV: development
          NEXT_PUBLIC_APP_ENV: development
          NEXT_PUBLIC_API_BASE_URL: https://ci-api.invalid
          NEXT_PUBLIC_USE_SUBJECT_MOCKS: "false"
